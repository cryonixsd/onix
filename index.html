<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Монитор группы</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef1f4;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h3 {
      margin-top: 0;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.8;
    }

    .green { background: #2ecc71; }
    .yellow { background: #f1c40f; color: black; }
    .blue { background: #3498db; }
    .gray { background: #7f8c8d; }

    .login-btn {
      background: #4285F4;
      width: 100%;
      padding: 12px;
    }

    .logout-btn {
      background: #e74c3c;
      width: 100%;
      margin-top: 10px;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .user:last-child {
      border-bottom: none;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2ecc71;
      flex-shrink: 0;
    }

    .offline .dot {
      background: #95a5a6;
    }

    small {
      color: #555;
      font-size: 12px;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 20px;
    }

    .error {
      color: #e74c3c;
      background: #fdeaea;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
    }

    .status-badge {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      padding: 3px 8px;
      background: #eef1f4;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <h3>Мой профиль</h3>
    <div id="info">
      <div class="loading">Проверка авторизации...</div>
    </div>
    <div id="profile-actions" class="hidden">
      <div class="buttons">
        <button class="green" id="status-study">📚 Учёба</button>
        <button class="yellow" id="status-coffee">☕ Кофе</button>
        <button class="blue" id="status-game">🎮 В игре</button>
        <button class="gray" id="status-home">🏠 Дома</button>
      </div>
      <button class="logout-btn" id="logout-btn">Выйти</button>
    </div>
  </div>

  <div class="card">
    <h3>Монитор группы</h3>
    <div id="group-list">Загрузка списка группы...</div>
  </div>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

// ⚠️ ВАЖНО: Замените эти данные на свои из Supabase!
const SUPABASE_URL = "https://lxceruhmesknzyjyyoqj.supabase.co"  // Замените на ваш URL
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4Y2VydWhtZXNrbnp5anl5b3FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2ODQ1MDQsImV4cCI6MjA5MjI2MDUwNH0.DyYepxX8QrEvaGp3-no0meXt2y6nOHigS56c4AldFjw"  // Замените на ваш anon ключ

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
})

let CURRENT_USER = null

// ======================
// GOOGLE LOGIN
// ======================
async function loginGoogle() {
  try {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "google",
      options: {
        redirectTo: window.location.href
      }
    })

    if (error) throw error
  } catch (error) {
    console.error("Ошибка авторизации:", error)
    alert("Ошибка авторизации: " + error.message)
  }
}

// ======================
// LOGOUT
// ======================
async function logout() {
  try {
    await supabase.auth.signOut()
    location.reload()
  } catch (error) {
    console.error("Ошибка выхода:", error)
    alert("Ошибка выхода: " + error.message)
  }
}

// ======================
// СМЕНА СТАТУСА
// ======================
async function changeStatus(text) {
  if (!CURRENT_USER) {
    alert("Сначала войдите!")
    return
  }

  try {
    const { error } = await supabase
      .from("profiles")
      .update({ status: text })
      .eq("id", CURRENT_USER.id)

    if (error) throw error

    // Обновляем список группы
    await fetchGroup()
  } catch (error) {
    console.error("Ошибка обновления статуса:", error)
    alert("Не удалось обновить статус: " + error.message)
  }
}

// ======================
// ПРОВЕРКА И АВТОСОЗДАНИЕ ПРОФИЛЯ
// ======================
async function ensureProfileExists() {
  if (!CURRENT_USER) return

  try {
    const { data: profile, error } = await supabase
      .from("profiles")
      .select("*")
      .eq("id", CURRENT_USER.id)
      .maybeSingle()

    if (error) throw error

    if (!profile) {
      const { error: insertError } = await supabase
        .from("profiles")
        .insert({
          id: CURRENT_USER.id,
          username: CURRENT_USER.user_metadata?.full_name || 
                   CURRENT_USER.email?.split('@')[0] || 
                   "Пользователь",
          status: "🟢 Онлайн"
        })

      if (insertError) throw insertError
      
      console.log("Профиль создан")
    }
  } catch (error) {
    console.error("Ошибка при проверке/создании профиля:", error)
    if (error.message.includes('row-level security')) {
      alert("Ошибка: Не настроены RLS политики в Supabase. Пожалуйста, выполните SQL запросы из инструкции.")
    } else {
      alert("Ошибка синхронизации профиля: " + error.message)
    }
  }
}

// ======================
// СБОР СПИСКА ГРУППЫ
// ======================
async function fetchGroup() {
  try {
    const { data, error } = await supabase
      .from("profiles")
      .select("*")
      .order("username", { ascending: true })

    if (error) throw error

    if (!data || data.length === 0) {
      document.getElementById("group-list").innerHTML = '<div class="loading">Нет участников</div>'
      return
    }

    // Рендерим всех пользователей
    document.getElementById("group-list").innerHTML = data.map(user => `
      <div class="user">
        <div class="dot"></div>
        <div style="flex: 1;">
          <div><strong>${escapeHtml(user.username)}</strong></div>
          <small>${escapeHtml(user.status || 'Не указан')}</small>
        </div>
      </div>
    `).join("")

    // Обновляем блок "Мой профиль"
    if (CURRENT_USER) {
      const me = data.find(u => u.id === CURRENT_USER.id)
      if (me) {
        document.getElementById("info").innerHTML = `
          <div><strong>${escapeHtml(me.username)}</strong></div>
          <small style="color: #666;">${escapeHtml(CURRENT_USER.email || '')}</small>
          <div class="status-badge">
            Твой статус: ${escapeHtml(me.status || 'Не указан')}
          </div>
        `
      } else {
        document.getElementById("info").innerHTML = `
          <div><strong>${escapeHtml(CURRENT_USER.email?.split('@')[0] || 'Пользователь')}</strong></div>
          <small style="color: #666;">${escapeHtml(CURRENT_USER.email || '')}</small>
          <div class="status-badge" style="background: #f1c40f;">
            Синхронизация профиля...
          </div>
        `
      }
    }
  } catch (error) {
    console.error("Ошибка получения списка группы:", error)
    document.getElementById("group-list").innerHTML = `
      <div class="error">
        Ошибка загрузки списка: ${escapeHtml(error.message)}
      </div>
    `
  }
}

// Вспомогательная функция для защиты от XSS
function escapeHtml(str) {
  if (!str) return ''
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
}

// ======================
// НАСТРОЙКА ОБРАБОТЧИКОВ КНОПОК
// ======================
function setupEventListeners() {
  // Кнопки статусов
  const statuses = {
    'status-study': '📚 Учёба',
    'status-coffee': '☕ Кофе',
    'status-game': '🎮 В игре',
    'status-home': '🏠 Дома'
  }
  
  for (const [id, status] of Object.entries(statuses)) {
    const btn = document.getElementById(id)
    if (btn) {
      btn.onclick = () => changeStatus(status)
    }
  }
  
  // Кнопка выхода
  const logoutBtn = document.getElementById('logout-btn')
  if (logoutBtn) {
    logoutBtn.onclick = () => logout()
  }
}

// ======================
// СЛУШАТЕЛЬ СОСТОЯНИЯ АВТОРИЗАЦИИ
// ======================
supabase.auth.onAuthStateChange(async (event, session) => {
  console.log("Auth event:", event)
  
  if (session) {
    CURRENT_USER = session.user
    document.getElementById("profile-actions").classList.remove("hidden")
    setupEventListeners()
    
    await ensureProfileExists()
    await fetchGroup()
  } else {
    CURRENT_USER = null
    document.getElementById("profile-actions").classList.add("hidden")
    document.getElementById("info").innerHTML = `
      <button class="login-btn" id="google-login-btn">
        Войти через Google
      </button>
    `
    document.getElementById("group-list").innerHTML = "Войдите, чтобы увидеть участников группы."
    
    // Навешиваем обработчик на кнопку логина
    const loginBtn = document.getElementById('google-login-btn')
    if (loginBtn) {
      loginBtn.onclick = () => loginGoogle()
    }
  }
})

// Инициализация при загрузке
setupEventListeners()

// Автоматическое обновление списка каждые 5 секунд
let intervalId = setInterval(() => {
  if (CURRENT_USER) {
    fetchGroup()
  }
}, 5000)

// Очистка интервала при перезагрузке (опционально)
window.addEventListener('beforeunload', () => {
  if (intervalId) clearInterval(intervalId)
})

// Делаем функции доступными для консоли (для отладки)
window.debug = {
  changeStatus,
  logout,
  loginGoogle,
  fetchGroup,
  currentUser: () => CURRENT_USER
}
</script>

</body>
</html>
