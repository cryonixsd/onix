<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Монитор группы</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef1f4;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h3 {
      margin-top: 0;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .green { background: #2ecc71; }
    .yellow { background: #f1c40f; color: black; }
    .blue { background: #3498db; }
    .gray { background: #7f8c8d; }

    .login-btn {
      background: #4285F4;
      width: 100%;
    }

    .logout-btn {
      background: #e74c3c;
      width: 100%;
      margin-top: 10px;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2ecc71;
    }

    small {
      color: #555;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h3>Мой профиль</h3>

    <div id="info">
      Проверка авторизации...
    </div>

    <div class="buttons">
      <button class="green" onclick="changeStatus('📚 Учёба')">📚 Учёба</button>
      <button class="yellow" onclick="changeStatus('☕ Кофе')">☕ Кофе</button>
      <button class="blue" onclick="changeStatus('🎮 В игре')">🎮 В игре</button>
      <button class="gray" onclick="changeStatus('🏠 Дома')">🏠 Дома</button>
    </div>

    <button class="logout-btn" onclick="logout()">
      Выйти
    </button>

  </div>

  <div class="card">
    <h3>Монитор группы</h3>

    <div id="group-list"></div>
  </div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const SUPABASE_URL =
  "https://lxceruhmesknzyjyyoqj.supabase.co"

const SUPABASE_KEY =
  "sb_publishable_P5E4C8LFgGgsqDFupEa2Vg_efVTmB59"

const supabase =
  createClient(SUPABASE_URL, SUPABASE_KEY)

let CURRENT_USER = null

// ======================
// LOGIN
// ======================

window.loginGoogle = async () => {

  const { error } =
    await supabase.auth.signInWithOAuth({

      provider: "google",

      options: {
        redirectTo:
          "https://cryonixsd.github.io/onix/"
      }

    })

  if (error) {
    console.error(error)
    alert(error.message)
  }

}

// ======================
// LOGOUT
// ======================

window.logout = async () => {

  await supabase.auth.signOut()

  location.reload()

}

// ======================
// INIT USER
// ======================

async function initUser() {

  const {
    data: { session }
  } = await supabase.auth.getSession()

  // НЕ ВОШЁЛ
  if (!session) {

    document.getElementById("info").innerHTML = `
      <button class="login-btn" onclick="loginGoogle()">
        Войти через Google
      </button>
    `

    return
  }

  CURRENT_USER = session.user

  // ПРОВЕРЯЕМ ПРОФИЛЬ
  const { data: profile } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", CURRENT_USER.id)
    .single()

  // ЕСЛИ НЕТ ПРОФИЛЯ
  if (!profile) {

    await supabase
      .from("profiles")
      .insert({

        id: CURRENT_USER.id,

        username:
          CURRENT_USER.user_metadata.full_name
          || CURRENT_USER.email,

        status: "🟢 Онлайн"

      })

  }

  fetchGroup()

}

// ======================
// CHANGE STATUS
// ======================

window.changeStatus = async (text) => {

  if (!CURRENT_USER) {
    alert("Сначала войдите")
    return
  }

  const { error } = await supabase
    .from("profiles")
    .update({
      status: text
    })
    .eq("id", CURRENT_USER.id)

  if (error) {

    console.error(error)
    alert(error.message)

    return
  }

  fetchGroup()

}

// ======================
// FETCH USERS
// ======================

async function fetchGroup() {

  const { data, error } = await supabase
    .from("profiles")
    .select("*")
    .order("username", {
      ascending: true
    })

  if (error) {

    console.error(error)

    return
  }

  // СПИСОК
  document.getElementById("group-list").innerHTML =

    data.map(user => `

      <div class="user">

        <div class="dot"></div>

        <div>
          <div>${user.username}</div>

          <small>
            ${user.status || 'Не указан'}
          </small>
        </div>

      </div>

    `).join("")

  // МОЙ ПРОФИЛЬ
  const me =
    data.find(u => u.id === CURRENT_USER?.id)

  if (me) {

    document.getElementById("info").innerHTML = `

      <b>${me.username}</b>
      <br>
      ${CURRENT_USER.email}

    `
  }

}

// ======================
// START
// ======================

initUser()

setInterval(fetchGroup, 5000)

</script>

</body>
</html>
