<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Монитор группы</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef1f4;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h3 {
      margin-top: 0;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .green { background: #2ecc71; }
    .yellow { background: #f1c40f; color: black; }
    .blue { background: #3498db; }
    .gray { background: #7f8c8d; }

    .login-btn {
      background: #4285F4;
      width: 100%;
      padding: 12px;
    }

    .logout-btn {
      background: #e74c3c;
      width: 100%;
      margin-top: 10px;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2ecc71;
    }

    small {
      color: #555;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <h3>Мой профиль</h3>

    <div id="info">
      Проверка авторизации...
    </div>

    <div id="profile-actions" class="hidden">
      <div class="buttons">
        <button class="green" onclick="changeStatus('📚 Учёба')">📚 Учёба</button>
        <button class="yellow" onclick="changeStatus('☕ Кофе')">☕ Кофе</button>
        <button class="blue" onclick="changeStatus('🎮 В игре')">🎮 В игре</button>
        <button class="gray" onclick="changeStatus('🏠 Дома')">🏠 Дома</button>
      </div>

      <button class="logout-btn" onclick="logout()">
        Выйти
      </button>
    </div>
  </div>

  <div class="card">
    <h3>Монитор группы</h3>
    <div id="group-list">Загрузка списка группы...</div>
  </div>

</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"

const SUPABASE_URL = "https://lxceruhmesknzyjyyoqj.supabase.co"
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4Y2VydWhtZXNrbnp5anl5b3FqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2ODQ1MDQsImV4cCI6MjA5MjI2MDUwNH0.DyYepxX8QrEvaGp3-no0meXt2y6nOHigS56c4AldFjw"

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
})

let CURRENT_USER = null

// ======================
// GOOGLE LOGIN
// ======================
window.loginGoogle = async () => {
  const { error } = await supabase.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: "https://cryonixsd.github.io/onix/index.html"
    }
  })

  if (error) {
    console.error(error)
    alert("Ошибка авторизации: " + error.message)
  }
}

// ======================
// LOGOUT
// ======================
window.logout = async () => {
  await supabase.auth.signOut()
  location.reload()
}

// ======================
// СМЕНА СТАТУСА
// ======================
window.changeStatus = async (text) => {
  if (!CURRENT_USER) {
    alert("Сначала войдите!")
    return
  }

  const { error } = await supabase
    .from("profiles")
    .update({ status: text })
    .eq("id", CURRENT_USER.id)

  if (error) {
    console.error(error)
    alert("Не удалось обновить статус: " + error.message)
    return
  }

  // Сразу обновляем список группы, чтобы увидеть свой новый статус
  await fetchGroup()
}

// ======================
// СЛУШАТЕЛЬ СОСТОЯНИЯ АВТОРИЗАЦИИ
// ======================
supabase.auth.onAuthStateChange(async (event, session) => {
  if (session) {
    CURRENT_USER = session.user
    document.getElementById("profile-actions").classList.remove("hidden")
    
    // Сначала убедимся, что профиль есть в БД, затем подгрузим список
    await ensureProfileExists()
    await fetchGroup()
  } else {
    CURRENT_USER = null
    document.getElementById("profile-actions").classList.add("hidden")
    document.getElementById("info").innerHTML = `
      <button class="login-btn" onclick="loginGoogle()">
        Войти через Google
      </button>
    `
    document.getElementById("group-list").innerHTML = "Войдите, чтобы увидеть участников группы."
  }
})

// ======================
// ПРОВЕРКА И АВТОСОЗДАНИЕ ПРОФИЛЯ
// ======================
async function ensureProfileExists() {
  if (!CURRENT_USER) return

  // .maybeSingle() не спамит ошибкой 406, если записи нет, а просто возвращает null
  const { data: profile, error } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", CURRENT_USER.id)
    .maybeSingle()

  if (error) {
    console.error("Ошибка при проверке профиля:", error.message)
    return
  }

  // Если пользователя еще нет в таблице profiles — создаем запись
  if (!profile) {
    const { error: insertError } = await supabase
      .from("profiles")
      .insert({
        id: CURRENT_USER.id,
        username: CURRENT_USER.user_metadata.full_name || CURRENT_USER.email || "Пользователь",
        status: "🟢 Онлайн"
      })

    if (insertError) {
      console.error("Не удалось создать профиль в БД:", insertError.message)
      alert("Ошибка создания профиля в базе данных. Убедись, что на таблице 'profiles' настроены RLS-политики на INSERT!")
    }
  }
}

// ======================
// СБОР СПИСКА ГРУППЫ
// ======================
async function fetchGroup() {
  const { data, error } = await supabase
    .from("profiles")
    .select("*")
    .order("username", { ascending: true })

  if (error) {
    console.error("Ошибка при получении списка группы:", error.message)
    return
  }

  // Рендерим всех юзеров
  document.getElementById("group-list").innerHTML = data.map(user => `
    <div class="user">
      <div class="dot"></div>
      <div>
        <div>${user.username}</div>
        <small>${user.status || 'Не указан'}</small>
      </div>
    </div>
  `).join("")

  // Обновляем блок "Мой профиль"
  if (CURRENT_USER) {
    const me = data.find(u => u.id === CURRENT_USER.id)
    if (me) {
      document.getElementById("info").innerHTML = `
        <b>${me.username}</b>
        <br>
        <small style="color: #666;">${CURRENT_USER.email}</small>
        <br>
        <span style="display:inline-block; margin-top:8px; font-size:12px; padding:3px 8px; background:#eef1f4; border-radius:4px; font-weight:bold;">
          Твой статус: ${me.status || 'Не указан'}
        </span>
      `
    } else {
      document.getElementById("info").innerHTML = `
        <b>Авторизован:</b> ${CURRENT_USER.email}<br>
        <span style="color: #f1c40f; font-size: 12px;">Синхронизация профиля с БД...</span>
      `
    }
  }
}

// Автоматическое обновление списка каждые 5 секунд
setInterval(() => {
  if (CURRENT_USER) {
    fetchGroup()
  }
}, 5000)

</script>

</body>
</html>
