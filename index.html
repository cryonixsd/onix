<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Firebase форма</title>

  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f4f9;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      background: #4a80e0;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #3a6fd0;
    }
  </style>
</head>
<body>

<div class="box">
  <h3>Отправить заявку</h3>

  <form id="form">
    <input type="text" id="name" placeholder="Имя" required>
    <input type="email" id="email" placeholder="Email" required>
    <button type="submit">Отправить</button>
  </form>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAr8f6PflSiVczpj8WgED80IiT3s-ZfyxA",
    authDomain: "messi-c20b5.firebaseapp.com",
    projectId: "messi-c20b5",
    storageBucket: "messi-c20b5.firebasestorage.app",
    messagingSenderId: "943341545721",
    appId: "1:943341545721:web:e361a31596f9c5165e9a28",
    measurementId: "G-DB7J25KXSL"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById("form");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;

    try {
      await addDoc(collection(db, "requests"), {
        name: name,
        email: email,
        createdAt: new Date()
      });

      alert("✅ Отправлено!");
      form.reset();

    } catch (err) {
      console.error(err);
      alert("❌ Ошибка");
    }
  });
</script>

</body>
</html>
